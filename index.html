@font-face{font-family:"AndikaX";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/andika-400-ext.woff2") format("woff2");unicode-range:U+20,U+A0,U+100-130,U+132-148,U+14A-151,U+154-17F,U+1CD-1DC,U+2020}
@font-face{font-family:"AndikaX";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/andika-400-latin.woff2") format("woff2");unicode-range:U+20-7E,U+A0-FF,U+131,U+152-153,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2212}
@font-face{font-family:"AndikaX";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/andika-700-ext.woff2") format("woff2");unicode-range:U+20,U+A0,U+100-130,U+132-148,U+14A-151,U+154-17F,U+1CD-1DC,U+2020}
@font-face{font-family:"AndikaX";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/andika-700-latin.woff2") format("woff2");unicode-range:U+20-7E,U+A0-FF,U+131,U+152-153,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2212}

/* Cap 945: a study notebook for the TOEIC. Light = blue-ruled paper and navy ink, dark = night desk.
   Every colour is a token defined in each theme block; text tokens keep 4.5:1 on --page and --bg. */
:root{
  --ui:"AndikaX",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tz:1;
}
:root[data-text="l"]{--tz:1.12}
:root[data-text="xl"]{--tz:1.25}
:root{
  --bg:#e8edf4;        /* desk */
  --page:#fbfcfe;      /* paper */
  --ink:#172033;       /* navy ink */
  --pencil:#46526a;    /* secondary text */
  --faint:#56617a;     /* captions */
  --rule:#d0d8e4;      /* hairlines */
  --accent:#2b56a8;    /* active state, links */
  --on-accent:#ffffff;
  --ok:#1d7546;        /* right answer */
  --ok-soft:#e2f2e8;
  --ko:#b9342a;        /* wrong answer, red pen */
  --ko-soft:#fbe6e3;
  --warn:#8a5a00;      /* late clock */
  --mark:#fde9a6;      /* highlighter under the word in an example */
  --bar:#7d9bd4;       /* chart bars */
  --shadow:rgba(23,32,51,.16);
  --veil:rgba(23,32,51,.42);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0f1420; --page:#18202f; --ink:#e4e9f2; --pencil:#aab4c6; --faint:#919cb0; --rule:#2b3547;
    --accent:#8fb2f5; --on-accent:#0e1730; --ok:#7fd3a0; --ok-soft:#163223; --ko:#ff9488; --ko-soft:#3a1d1b;
    --warn:#f2c46b; --mark:#4d4320; --bar:#5b78b5; --shadow:rgba(0,0,0,.55); --veil:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --page:#18202f; --ink:#e4e9f2; --pencil:#aab4c6; --faint:#919cb0; --rule:#2b3547;
  --accent:#8fb2f5; --on-accent:#0e1730; --ok:#7fd3a0; --ok-soft:#163223; --ko:#ff9488; --ko-soft:#3a1d1b;
  --warn:#f2c46b; --mark:#4d4320; --bar:#5b78b5; --shadow:rgba(0,0,0,.55); --veil:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:calc(16px * var(--tz));line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
i[lang="en"]{font-style:italic}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:680px;width:100%;margin:0 auto}
.brand{font-size:22px;line-height:1;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--accent)}
.counts{margin-left:auto;display:flex;gap:6px;min-width:0}
.count{display:flex;align-items:baseline;gap:5px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;
  background:var(--page);font-size:13px;color:var(--pencil);white-space:nowrap}
.count b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{max-width:680px;margin:0 auto;padding:6px 16px 32px}
.tabs{order:1;flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--page);border-top:1px solid var(--rule);
  padding:0 max(env(safe-area-inset-left,0px),4px) env(safe-area-inset-bottom,0px) max(env(safe-area-inset-right,0px),4px)}
.tab{appearance:none;border:0;background:none;color:var(--faint);padding:8px 0 7px;min-height:54px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
h2{font-size:calc(19px * var(--tz));margin:14px 0 6px}
h3{font-size:calc(16px * var(--tz));margin:18px 0 6px}
p{margin:6px 0}
.small{font-size:calc(14px * var(--tz));color:var(--pencil)}
.faint{color:var(--faint)}
.loading{padding:40px 0;text-align:center;color:var(--pencil)}

/* ---------- controls ---------- */
.btn{appearance:none;border:1.5px solid var(--rule);background:var(--page);color:var(--ink);border-radius:12px;padding:9px 16px;min-height:44px;
  font-size:calc(16px * var(--tz));display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.danger{color:var(--ko);border-color:var(--ko)}
.btn.big{width:100%;min-height:52px;font-size:calc(17px * var(--tz))}
.btn.small{min-height:36px;padding:5px 12px;font-size:calc(14px * var(--tz));border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 0}
.box{background:var(--page);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px var(--shadow)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--rule);border-radius:12px;background:var(--bg);padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;border-radius:9px;padding:6px 4px;min-height:38px;font-size:calc(14px * var(--tz));color:var(--pencil)}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);font-weight:700;box-shadow:0 1px 3px var(--shadow)}
.field{margin:12px 0}
.field > .lbl{display:block;font-size:calc(14px * var(--tz));color:var(--pencil);margin-bottom:5px}
.hint{font-size:calc(13px * var(--tz));color:var(--faint);margin:5px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:calc(13px * var(--tz));
  color:var(--pencil);background:var(--page);white-space:nowrap}
.chip.new{border-color:var(--accent);color:var(--accent)}
.chip.ko{border-color:var(--ko);color:var(--ko)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
button.chip{appearance:none;min-height:34px;padding:4px 12px}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.switchrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.switchrow:first-child{border-top:0}
.switchrow .txt{flex:1;min-width:0}
.switchrow .txt small{display:block;color:var(--faint);font-size:calc(13px * var(--tz))}
.switch{appearance:none;flex:none;width:50px;height:30px;border-radius:999px;border:1.5px solid var(--rule);background:var(--bg);position:relative;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--faint);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-accent)}
.switch:disabled{opacity:.45}
input[type="search"],input[type="date"],input[type="text"]{width:100%;font-size:max(16px, calc(16px * var(--tz)));padding:10px 12px;border:1.5px solid var(--rule);
  border-radius:12px;background:var(--page);color:var(--ink);min-height:46px}
.say{appearance:none;flex:none;border:1.5px solid var(--rule);background:var(--page);color:var(--accent);border-radius:50%;width:38px;height:38px;
  display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.say svg{width:20px;height:20px}
.say.playing{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.keys{display:none;margin:14px 2px 0;font-size:calc(13px * var(--tz));color:var(--faint);text-align:center}
.keys kbd{font-family:var(--ui);font-size:calc(12px * var(--tz));border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--page);color:var(--pencil)}
@media (hover:hover) and (pointer:fine){ .keys{display:block} }

/* ---------- vocabulary ---------- */
.vcard{background:var(--page);border:1px solid var(--rule);border-radius:18px;box-shadow:0 2px 8px var(--shadow);padding:16px 18px 18px;margin:8px 0 14px;min-height:230px;
  display:flex;flex-direction:column}
.v-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:calc(13px * var(--tz));color:var(--faint)}
.v-meta .v-list{margin-left:auto}
.v-front{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 0 18px;min-height:130px}
.v-en{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.v-en > span{font-size:calc(30px * var(--tz));font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.v-fr{font-size:calc(22px * var(--tz));line-height:1.35}
.v-back{border-top:1.5px dashed var(--rule);padding-top:14px;text-align:center}
.v-back .v-en > span{font-size:calc(26px * var(--tz))}
.v-ex{font-size:calc(17px * var(--tz));margin:14px 0 4px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.v-ex span{flex:1}
.v-exfr{font-size:calc(15px * var(--tz));color:var(--pencil);text-align:left;margin:2px 48px 0 0}
.v-note{text-align:left;font-size:calc(14px * var(--tz));background:var(--bg);border-radius:10px;padding:8px 12px;margin:12px 0 0;color:var(--ink)}
.v-note::before{content:"À retenir · ";font-weight:700;color:var(--accent)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade{appearance:none;border:2px solid var(--rule);border-radius:14px;background:var(--page);min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px}
.grade b{font-size:26px;line-height:1}
.grade span{font-size:calc(13px * var(--tz));color:var(--pencil)}
.grade.ko b{color:var(--ko)} .grade.ok b{color:var(--ok)}
.grade.ko{border-color:color-mix(in srgb,var(--ko) 45%,var(--rule))}
.grade.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--rule))}
.empty{text-align:center;padding:36px 8px;color:var(--pencil)}
.empty strong{display:block;font-size:calc(19px * var(--tz));color:var(--ink);margin-bottom:6px}
.foot{margin-top:18px;display:flex;justify-content:center}
.wlist{list-style:none;margin:8px 0 0;padding:0}
.wlist li{border-top:1px solid var(--rule)}
.wrow{appearance:none;border:0;background:none;width:100%;text-align:left;padding:9px 2px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.wrow .en{font-weight:700}
.wrow .fr{grid-column:1;color:var(--pencil);font-size:calc(14px * var(--tz))}
.wrow .st{grid-column:2;grid-row:1 / span 2;font-size:calc(12px * var(--tz));color:var(--faint);white-space:nowrap;align-self:center}
.wmore{padding:0 2px 12px;font-size:calc(15px * var(--tz))}
.wmore .v-ex{margin-top:4px}

/* ---------- question series (Part 5, Part 2) ---------- */
.intro{color:var(--pencil);margin:4px 0 2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(14px * var(--tz));color:var(--pencil);margin:8px 0}
.stats b{color:var(--ink)}
.runbar{display:flex;align-items:center;gap:10px;margin:6px 0 8px}
.runbar .pos{font-size:calc(14px * var(--tz));color:var(--pencil)}
.clock{margin-left:auto;font-size:calc(15px * var(--tz));font-weight:700;color:var(--pencil);min-width:3.2em;text-align:right}
.clock.late{color:var(--warn)}
.clock.low{color:var(--ko)}
.track{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.sentence{font-size:calc(19px * var(--tz));line-height:1.6;background:var(--page);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 4px}
.gap{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);margin:0 2px;height:1.1em;vertical-align:baseline}
.fill{font-weight:700;border-bottom:2px solid currentColor;padding:0 2px}
.fill.ok{color:var(--ok)} .fill.ko{color:var(--ko)}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:12px;background:var(--page);
  padding:9px 14px;min-height:50px;font-size:calc(17px * var(--tz))}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);font-weight:700;
  font-size:calc(14px * var(--tz));color:var(--pencil)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.sel{border-color:var(--accent)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--page)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt.ko .L{background:var(--ko);border-color:var(--ko);color:var(--page)}
.opt.dim{opacity:.62}
.feedback{background:var(--page);border:1px solid var(--rule);border-radius:16px;padding:12px 16px 14px;margin:4px 0 12px}
.fb-head{font-weight:700;font-size:calc(17px * var(--tz));display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fb-head.ok{color:var(--ok)} .fb-head.ko{color:var(--ko)}
.fb-head .t{margin-left:auto;font-weight:400;font-size:calc(14px * var(--tz));color:var(--faint)}
.expl{margin:8px 0}
.trad{color:var(--pencil);font-size:calc(15px * var(--tz))}
details.more{margin:6px 0}
details.more summary{color:var(--accent);cursor:pointer;font-size:calc(15px * var(--tz));min-height:34px;display:flex;align-items:center}
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 10px}
.abc .opt{justify-content:center;min-height:76px;font-size:calc(28px * var(--tz));font-weight:700;padding:6px}
.listen{display:flex;align-items:center;gap:14px;background:var(--page);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;min-height:86px}
.listen .msg{flex:1;color:var(--pencil)}
.listen .msg b{display:block;color:var(--ink);font-size:calc(17px * var(--tz))}
.wave{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:4px}
.wave i{width:4px;height:12px;border-radius:2px;background:var(--accent);opacity:.5}
.wave.on i{opacity:1;animation:wave 1s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s} .wave.on i:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,100%{height:10px}50%{height:26px}}
.window{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:10px}
.window i{display:block;height:100%;width:100%;background:var(--warn)}
.window.run i{width:0;transition:width 5s linear}
.readtext{background:var(--page);border:1px dashed var(--rule);border-radius:12px;padding:10px 14px;margin:10px 0}
/* sets: documents, recordings, several questions answered together */
.partsel{margin:4px 0 8px}
.doc{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:12px 16px;margin:0 0 12px;font-size:calc(16px * var(--tz));line-height:1.55}
.doc p{margin:8px 0}
.doc h3{margin:4px 0 6px;font-size:calc(17px * var(--tz))}
.doc-kind{font-size:calc(12px * var(--tz));color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.doc .chat{display:block;padding:2px 0}
.mk{color:var(--accent)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);padding:0 3px;font-weight:700}
.blank .n{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--bg);border:1px solid var(--rule);
  font-size:.75em;margin-right:4px;color:var(--pencil);vertical-align:.1em}
.blank[data-b]{cursor:pointer}
.blank.on{color:var(--accent);border-color:var(--accent)}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.ko{color:var(--ok);border-color:var(--ko)}
.blank.ko s{color:var(--ko);font-weight:400}
.tblwrap{overflow-x:auto;margin:10px 0}
.tbl{border-collapse:collapse;font-size:calc(14px * var(--tz));min-width:60%;background:var(--page)}
.tbl caption{text-align:left;font-weight:700;padding:4px 0}
.tbl th,.tbl td{border:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.sqs{list-style:none;padding:0;margin:14px 0 0;counter-reset:sq}
.sq{margin:0 0 14px;padding-top:10px;border-top:1px solid var(--rule)}
.sq .qt{font-weight:700;margin:0 0 6px;display:flex;gap:8px}
.sq .qt::before{counter-increment:sq;content:counter(sq) ".";color:var(--accent);flex:none}
.sq .opts{margin:6px 0}
.sq .opt{min-height:44px;font-size:calc(16px * var(--tz))}
.sqfb{margin:6px 0 0}
.setact{margin:8px 0 6px}
.lines p{margin:6px 0}
.lines .who{color:var(--accent);margin-right:4px}
.lines .trad{display:block;font-size:calc(14px * var(--tz))}
.trad-doc{font-size:calc(15px * var(--tz));color:var(--pencil)}
.mocklist{list-style:none;padding:0;margin:6px 0}
.mocklist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:calc(15px * var(--tz))}
.tr-opts{list-style:none;padding:0;margin:8px 0}
.tr-opts li{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.tr-opts li b{flex:none;width:2.2em;color:var(--pencil)}
.tr-opts li.ok{color:var(--ok);font-weight:700}
.tr-opts li.ko{color:var(--ko);text-decoration:line-through}
.tq{font-weight:700;display:flex;gap:10px;align-items:center}
.tq span{flex:1}

.confirm{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:calc(14px * var(--tz))}
.brow .bt{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--bg);position:relative;overflow:hidden;border:1px solid var(--rule)}
.brow .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.brow .bt i.good{background:var(--ok)}
.brow .bt u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.brow .v{color:var(--pencil);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:6px;align-items:end;height:120px;margin:12px 0 4px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.cols .c i{display:block;width:100%;max-width:36px;border-radius:5px 5px 0 0;background:var(--bar);min-height:2px}
.cols .c.miss i{background:var(--ko)}
.cols .c span{font-size:calc(12px * var(--tz));color:var(--pencil);font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:6px;text-align:center;font-size:calc(12px * var(--tz));color:var(--faint)}
.big{font-size:calc(30px * var(--tz));font-weight:700;line-height:1.15}

/* ---------- sheet, toast, update bar ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.veil{position:absolute;inset:0;background:var(--veil)}
.panel{position:relative;background:var(--page);width:100%;max-width:680px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 20px var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 12px 6px 18px}
.panel-head h2{margin:0;flex:1;font-size:calc(18px * var(--tz))}
.close{appearance:none;border:0;background:var(--bg);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;padding:0}
#sheet-body{overflow-y:auto;padding:4px 18px 20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:var(--page);
  border-radius:12px;padding:10px 14px;font-size:calc(15px * var(--tz));box-shadow:0 4px 16px var(--shadow);text-align:center}
.updatebar{position:fixed;left:16px;right:16px;top:calc(8px + env(safe-area-inset-top,0px));z-index:25;max-width:520px;margin:0 auto;background:var(--page);
  border:1.5px solid var(--accent);border-radius:12px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px var(--shadow)}
.updatebar span{flex:1}

:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ---------- computer screen ---------- */
@media (min-width:900px) and (min-height:500px){
  .app{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

  main{grid-column:2}

  .sheet{justify-content:flex-end;align-items:stretch}
  .panel{max-width:520px;max-height:none;height:100%;border-radius:0}
  .toast{bottom:24px}
}

  if (t) r.dataset.theme = t; else delete r.dataset.theme;
  r.dataset.text = s && (s.textSize === "l" || s.textSize === "xl") ? s.textSize : "m";
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) {

function qStats(pool) {
  const today = dayNum(), tags = {};

  for (const q of pool) {
    const T = tags[q.tag] || (tags[q.tag] = { total: 0, n: 0, ok: 0 });

    seen++; T.n++;
    if (s.f) { first++; T.ok++; }

  s.r++;
  if (ok) s.ok++; else s.l++;

  if (!ok) { s.e = 1; s.d = today + ERR_DELAYS[0]; }

    if (s.e < ERR_DELAYS.length) { s.d = today + ERR_DELAYS[s.e]; s.e++; }

  logAdd(q.kind);

function pickSeries(kind, size, tag) {
  // questions (Parts 2 and 5) or sets (the others, whose questions are all answered together): the mistakes due

  const today = dayNum(), errs = [], old = [], later = [];
  let fresh = [];
  if (KINDS[kind].sets) {
    for (const set of SETS[kind]) {
      if ((tag === "simple" && set.docs.length !== 1) || (tag === "multiple" && set.docs.length < 2)) continue;
      let seen = false, due = null, wait = null, t = 0;
      for (const q of set.qs) {
        const s = state.q[q.id];
        if (!s || !s.r) continue;
        seen = true; t = Math.max(t, s.t || 0);

      }

      else if (due != null) errs.push([due, t, set.id]);

      else old.push([t, 0, set.id]);

    for (const q of pool(kind).filter(q => !tag || q.tag === tag)) {
      const s = state.q[q.id];
      if (!s || !s.r) fresh.push(q.id);
      else if (s.e >= 1) (s.d <= today ? errs : later).push([s.d, s.t || 0, q.id]);

    const w = tagWeights(kind);
    const weight = id => KINDS[kind].sets ? avgOf(SBYID.get(id).qs.map(q => w[q.tag] || 1)) : (w[QBYID.get(id).tag] || 1);
    fresh = weightedShuffle(fresh, weight);

  let pick = errs.slice(0, half).map(x => x[2]);   // the mistakes due first, half the series at most while new ones remain
  pick = pick.concat(fresh.slice(0, size - pick.length));
  pick = pick.concat(errs.slice(half).map(x => x[2]).slice(0, size - pick.length));
  pick = pick.concat(old.map(x => x[2]).slice(0, size - pick.length));
  pick = pick.concat(later.map(x => x[2]).slice(0, size - pick.length));

}
function avgOf(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0; }
function tagWeights(kind) {

  const w = {};

// state.mock: {format, stages [{kind, ids}], stage, res [{kind, ids, ans, why}], start, leftR (ms of reading time left),
// saved {kind: a series set aside until the end}}. Each stage is an exam series of its part, marked mock: finish()
// hands it to mockNext instead of showing its results. state.mocks: the finished ones, the latest first.
let mockDone = null;                               // the mock test just finished, for its results screen
function scaled(table, ratio) {                    // piecewise linear, rounded to 5 like the test's scores
  const x = Math.max(0, Math.min(100, ratio * 100));
  for (let i = 1; i < table.length; i++) {
    const [x0, y0] = table[i - 1], [x1, y1] = table[i];
    if (x <= x1) return Math.round((y0 + (y1 - y0) * (x - x0) / (x1 - x0)) / 5) * 5;

function cefr(table, score) { const r = table.find(([, min]) => score >= min); return r ? r[0] : "avant A1"; }
function mockPick(kind, n, filter) {

  const items = KINDS[kind].sets ? SETS[kind].filter(s => !filter || filter(s)).map(s => [s.id, s.qs]) : pool(kind).map(q => [q.id, [q]]);
  const fresh = [], seen = [];
  for (const [id, qs] of items) {
    const t = Math.max(-1, ...qs.map(q => { const s = state.q[q.id]; return s && s.r ? s.t || 0 : -1; }));
    (t < 0 ? fresh : seen).push([t, id]);

function mockStages(format) {

  for (const k of ["p2", "p3", "p4", "p5", "p6"]) if (P[k]) add(k, mockPick(k, P[k]));
  if (P.p7s != null) {                             // single documents up to p7s questions, then double, then triple sets
    const p7 = [];

    for (const id of mockPick("p7", 999, s => s.docs.length === 1)) { if (n >= P.p7s) break; p7.push(id); n += SBYID.get(id).qs.length; }

}
function startMock(format) {

function startStage() {

function mockNext(kind, run, why) {

/* ---------- settings ---------- */
function switchHTML(attr, val, on, label, disabled) {
  return `<button type="button" class="switch" role="switch" ${attr}="${esc(val)}" aria-checked="${String(!!on)}" aria-label="${esc(label)}"${disabled ? " disabled" : ""}></button>`;
}
function renderSettings() {
  const S = state.settings;
  let h = `<h2>Vocabulaire</h2><div class="box">`;
  for (const L of VLISTS) {
    const seen = L.ids.filter(id => !inPass(id)).length;
    h += `<div class="switchrow"><div class="txt">${esc(L.nom)}<small>${plural(L.ids.length, "mot", "mots")}${seen ? `, ${seen} vus` : ""}</small></div>${switchHTML("data-list", L.id, listOn(L.id), L.nom)}</div>`;
  }
  if (!VLISTS.length) h += `<p class="small">Aucun thème dans la banque.</p>`;
  h += `</div>`;
  h += `<div class="field"><span class="lbl">Nouveaux mots</span>${segHTML("newOrder", [["mix", "Thèmes mélangés"], ["lists", "Thème par thème"]])}</div>`;
  h += `<div class="field"><span class="lbl">Face montrée d’abord</span>${segHTML("firstSide", [["en", "Anglais"], ["fr", "Français"]])}</div>`;
  h += `<div class="box"><div class="switchrow"><div class="txt">Lire le mot à voix haute<small>Quand la carte montre l’anglais.</small></div>${switchHTML("data-flag", "autoAudio", S.autoAudio, "Lire le mot à voix haute")}</div></div>`;

  h += `<h2>Voix</h2>`;
  if (!speech.ok) h += `<p class="small">Cet appareil ne lit pas le texte à voix haute.</p>`;
  else {
    h += `<p class="small">Le TOEIC fait entendre des accents américain, britannique, australien et canadien. Choisis ceux que tu veux entendre.</p><div class="box">`;
    for (const A of ACCENTS) {
      const c = speech.count(A.id);
      h += `<div class="switchrow"><div class="txt">${A.nom}<small>${c ? plural(c, "voix", "voix") + " sur cet appareil" : "aucune voix sur cet appareil"}</small></div>` +
        (c ? `<button type="button" class="btn small" data-try="${A.id}">Essayer</button>` : "") +
        switchHTML("data-acc", A.id, S.accents.includes(A.id), A.nom, !c) + `</div>`;
    }
    h += `</div><div class="field"><span class="lbl">Vitesse</span>${segHTML("rate", [[0.8, "Lente"], [0.9, "Posée"], [1, "Normale"], [1.1, "Rapide"]])}</div>`;
    h += `<p class="hint">Sur iPhone, d’autres voix se téléchargent dans Réglages › Accessibilité › Contenu énoncé › Voix › Anglais. Les voix « améliorées » sont bien plus naturelles.</p>`;
  }

  h += `<h2>Séries</h2><div class="box"><div class="switchrow"><div class="txt">Insister sur mes points faibles<small>Les nouvelles questions viennent ` +
    `plus souvent des compétences où tu réussis le moins au premier essai.</small></div>${switchHTML("data-flag", "adaptive", S.adaptive, "Insister sur mes points faibles")}</div></div>`;
  h += `<h2>Examen</h2><div class="field"><label class="lbl" for="exam-date">Date de l’examen</label><input type="date" id="exam-date" value="${esc(S.exam)}"></div>`;

  h += `<h2>Affichage</h2><div class="field"><span class="lbl">Thème</span>${segHTML("theme", [["auto", "Automatique"], ["light", "Clair"], ["dark", "Sombre"]])}</div>`;
  h += `<div class="field"><span class="lbl">Taille du texte</span>${segHTML("textSize", [["m", "Normale"], ["l", "Grande"], ["xl", "Très grande"]])}</div>`;

  h += `<h2>Sauvegarde</h2><p class="small">Ta progression reste sur cet appareil. Garde-en une copie de temps en temps.</p>` +
    `<div class="row"><button type="button" class="btn" id="backup-save">Exporter</button><button type="button" class="btn" id="backup-load">Importer</button></div>` +
    `<input type="file" id="backup-file" accept="application/json,.json" hidden>`;

  const parts = Object.keys(KINDS).sort().filter(k => pool(k).length).map(k => `${KINDS[k].nom.slice(5)}${NB}: ${pool(k).length}`);
  h += `<h2>Appli</h2><div class="box"><div class="switchrow"><div class="txt">Version du ${esc(BUILD)}<small>${plural(WORDS.length, "mot", "mots")} ; questions par partie, ${parts.join(", ")}` +
    `${missingFiles.length ? `. Fichiers non lus${NB}: ${esc(missingFiles.join(", "))}` : ""}</small></div><button type="button" class="btn small" id="app-update">Vérifier</button></div></div>`;
  if (!matchMedia("(display-mode: standalone)").matches && !navigator.standalone)
    h += `<p class="hint">Pour l’installer sur l’iPhone${NB}: dans Safari, Partager › Sur l’écran d’accueil. Elle marche ensuite hors ligne.</p>`;
  $("#view-reglages").innerHTML = h;
}
function setSetting(key, raw) {
  const S = state.settings;
  const val = key === "rate" || /^p\dSize$/.test(key) ? Number(raw) : raw;
  if (S[key] === val) return;
  S[key] = val;
  save();
  if (key === "theme" || key === "textSize") applyLook(S);
  if (key === "newOrder") { buildOrder(); vstudy.cur = null; }
  if (key === "firstSide") vstudy.turned = false;
  renderView();
}

/* ---------- backup ---------- */
async function exportBackup() {
  const d = new Date(), name = `cap945-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
  const text = JSON.stringify({ app: "cap945", v: 1, at: d.toISOString(), state }, null, 1);
  const file = new File([text], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Sauvegarde Cap 945" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Sauvegarde enregistrée : " + name);
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    let data = null;
    try { data = JSON.parse(r.result); } catch (e) {}
    if (!data || data.app !== "cap945" || !isObj(data.state)) { toast("Ce fichier n’est pas une sauvegarde de Cap 945."); return; }
    const when = data.at ? new Date(data.at) : null;
    openSheet("Importer la sauvegarde", `<p>Remplacer ta progression actuelle par celle du fichier${when && !isNaN(when) ? ` du ${dateText(dayNum(when.getTime()))}` : ""}${NB}?</p>` +
      `<p class="small">Ce qui n’est que sur cet appareil sera perdu.</p><div class="confirm"><button type="button" class="btn primary" id="imp-yes">Remplacer</button><button type="button" class="btn" data-close>Annuler</button></div>`);
    $("#imp-yes").addEventListener("click", () => {
      state = normalizeState(data.state);
      live.p5 = {}; live.p2 = {}; vstudy.cur = null;
      save(); applyLook(state.settings); buildOrder();
      closeSheet();
      toast("Sauvegarde importée.");
      renderView();
    });
  };
  r.readAsText(file);
}

/* ---------- sheet, toast, update ---------- */
let sheetFrom = null;
function openSheet(title, html) {
  sheetFrom = document.activeElement;
  $("#sheet-title").textContent = title;
  $("#sheet-body").innerHTML = html;
  $("#sheet").hidden = false;
  const f = $("#sheet-body input, #sheet-body button") || $("#sheet .close");
  f.focus({ preventScroll: true });
}
function closeSheet() {
  $("#sheet").hidden = true;
  $("#sheet-body").innerHTML = "";
  if (sheetFrom && document.contains(sheetFrom)) sheetFrom.focus({ preventScroll: true });
}
let toastT = 0;
function toast(msg, ms = 2800) {
  const t = $("#toast");
  t.textContent = frTypo(msg); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
}
let swReg = null, swChecked = Date.now();
async function updateApp() {
  const b = $("#app-update");
  b.disabled = true; b.textContent = "Recherche…";
  try {
    await loadBank().catch(() => {});
    if (swReg) {
      await swReg.update().catch(() => {});
      const w = swReg.installing || swReg.waiting;
      if (w) {
        toast("Nouvelle version trouvée : rechargement…");
        await new Promise(r => { const t = setTimeout(r, 4000); w.addEventListener("statechange", () => { if (w.state === "activated") { clearTimeout(t); r(); } }); });
        location.reload();
        return;
      }
    }
    toast("L’appli est à jour. Banque de questions relue.");
    renderView();
  } finally { b.disabled = false; b.textContent = "Vérifier"; }
}

/* ---------- wiring ---------- */
function onKindClick(kind, e) {
  const t = e.target;
  const part = t.closest("[data-part]");
  if (part) {                                      // another part of the tab (Part 5, 6, 7 or Part 2, 3, 4)
    const to = part.dataset.part;
    if (to !== kind && KINDS[to]) {
      suspend(kind);
      state.settings[KINDS[to].tab === "lecture" ? "readPart" : "listenPart"] = to;
      save();
      renderKind(to);
      renderCounts();
    }
    return;
  }
  if (KINDS[kind].sets && !$(`#${kind}-run`).hidden && onSetClick(kind, e)) return;
  const opt = t.closest(".opt[data-c]");
  if (opt && !opt.disabled) { choose(kind, Number(opt.dataset.c)); return; }
  const sq = t.closest("[data-say-q]");
  if (sq) { replayItem(sq.dataset.sayQ, sq); return; }
  const set = t.closest("[data-set]");
  if (set) { setSetting(set.dataset.set, set.dataset.v); return; }
  const tag = t.closest("[data-tag]");
  if (tag) { state.settings[kind + "Tag"] = tag.dataset.tag; save(); renderHome(kind); return; }
  const act = t.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "start" || a === "again") { live[kind] = {}; startRun(kind); }
  else if (a === "resume") { live[kind] = { on: true }; show(kind); }
  else if (a === "to-exam") showView("examen");
  else if (a === "drop") {
    $(`#${kind}-runbtns`).innerHTML = `<p class="small" style="flex-basis:100%">Abandonner cette série${NB}? Tes réponses déjà données restent comptées.</p>` +
      `<button type="button" class="btn danger" data-act="drop-yes">Abandonner</button><button type="button" class="btn" data-act="home">Garder</button>`;
  } else if (a === "drop-yes") { state.runs[kind] = null; live[kind] = {}; save(); renderHome(kind); renderCounts(); }
  else if (a === "home") { live[kind] = {}; renderHome(kind); $("#main").scrollTop = 0; }
  else if (a === "next") next(kind);
}
function bind() {
  for (const t of $$(".tab")) t.addEventListener("click", () => showView(t.dataset.view));
  $("#v-turn").addEventListener("click", vTurn);
  $("#vcard").addEventListener("click", e => {
    const s = e.target.closest("[data-say]");
    if (s) { e.stopPropagation(); const w = WBYID.get(vstudy.cur); if (w) speech.say(s.dataset.say === "ex" ? w.ex : w.en, wordVoice(w.id), s); return; }
    if (!vstudy.turned) vTurn();
  });
  $("#v-grades").addEventListener("click", e => { const g = e.target.closest(".grade"); if (g) vGrade(g.dataset.g === "1"); });
  $("#v-browse").addEventListener("click", browseSheet);
  for (const tab of ["lecture", "ecoute"]) $(`#view-${tab}`).addEventListener("click", e => onKindClick(partOf(tab), e));
  for (const kind of ["p5", "p2"]) $(`#${kind}-stop`).addEventListener("click", () => stopRun(kind));
  $("#view-examen").addEventListener("click", e => {
    const t = e.target, set = t.closest("[data-set]");
    if (set) { setSetting(set.dataset.set, set.dataset.v); return; }
    const act = t.closest("[data-act]");
    if (!act) return;
    const a = act.dataset.act;
    if (a === "mock-start") startMock(state.settings.mockFormat);
    else if (a === "mock-resume") mockResume();
    else if (a === "mock-drop") $("#mock-btns").innerHTML = `<p class="small" style="flex-basis:100%">Abandonner l’examen${NB}? Il n’aura pas de score ; tes réponses restent comptées dans tes statistiques.</p>` +
      `<button type="button" class="btn danger" data-act="mock-drop-yes">Abandonner</button><button type="button" class="btn" data-act="mock-keep">Continuer</button>`;
    else if (a === "mock-drop-yes") mockDrop();
    else if (a === "mock-keep") renderExam();
    else if (a === "mock-close") { mockDone = null; renderExam(); $("#main").scrollTop = 0; }
  });
  $("#p2-replay").addEventListener("click", () => { if (!answered("p2")) p2Play(); else { const q = curQ("p2"); if (q) speech.seq(p2Parts(q, live.p2.V), null, $("#p2-replay")); } });
  $("#view-reglages").addEventListener("click", e => {
    const t = e.target;
    const set = t.closest("[data-set]");
    if (set) { setSetting(set.dataset.set, set.dataset.v); return; }
    const sw = t.closest(".switch");
    if (sw && !sw.disabled) {
      const on = sw.getAttribute("aria-checked") !== "true";
      if (sw.dataset.list) {
        state.lists[sw.dataset.list] = { on };
        buildOrder(); vstudy.cur = null;
      } else if (sw.dataset.acc) {
        const A = state.settings.accents.filter(x => x !== sw.dataset.acc);
        if (on) A.push(sw.dataset.acc);
        state.settings.accents = A;
      } else if (sw.dataset.flag) state.settings[sw.dataset.flag] = on;
      save();
      sw.setAttribute("aria-checked", String(on));
      renderCounts();
      return;
    }
    const tr = t.closest("[data-try]");
    if (tr) {
      const vs = speech.voices.filter(x => x.accent === tr.dataset.try);
      const v = vs[Math.floor(Math.random() * vs.length)];
      if (v) speech.say("Could you send me the revised schedule before Friday’s meeting?", v.v, tr);
      return;
    }
    if (t.closest("#backup-save")) exportBackup();
    else if (t.closest("#backup-load")) $("#backup-file").click();
    else if (t.closest("#app-update")) updateApp();
  });
  $("#view-reglages").addEventListener("change", e => {
    if (e.target.id === "exam-date") { state.settings.exam = dayOfISO(e.target.value) ? e.target.value : ""; save(); }
    if (e.target.id === "backup-file" && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; }
  });
  $("#sheet").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });
  $("#update-reload").addEventListener("click", () => location.reload());
  const unlock = () => {                           // Safari speaks only once a first utterance came from a touch or a key
    if (!speech.ok || speech.unlocked) return;
    speech.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  };
  document.addEventListener("pointerdown", unlock, { capture: true });
  document.addEventListener("keydown", unlock, { capture: true });
  document.addEventListener("keydown", onKey);
  document.addEventListener("visibilitychange", onVisibility);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyLook(state.settings));
  window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { state = loadState(); buildOrder(); renderView(); } });
}
function focusedButton() {                         // a visible button with the focus keeps its own Space and Enter
  const el = document.activeElement;               // (a button hidden with its panel may keep the focus)
  return !!el && el !== document.body && el.matches("button, a, summary") && !el.matches('.tab[aria-current="page"]') && el.getClientRects().length > 0;
}
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("#sheet").hidden) { if (e.key === "Escape") closeSheet(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  const k = e.key.toLowerCase(), go = k === " " || k === "enter";
  const el = document.activeElement;
  const btn = focusedButton();
  if (current === "mots" && vstudy.cur && !$("#v-study").hidden) {
    if (go) { if (btn) return; e.preventDefault(); vTurn(); }   // a focused button keeps its own Space and Enter
    else if (vstudy.turned && (k === "1" || k === "2")) { e.preventDefault(); vGrade(k === "2"); }
    else if (k === "l") { e.preventDefault(); sayWord(); }
    return;
  }
  const kind = partOf(current);
  if (!kind || !state.runs[kind] || $(`#${kind}-run`).hidden) return;
  if (KINDS[kind].sets) { onSetKey(kind, e, k, go); return; }
  const n = kind === "p5" ? 4 : 3;
  let c = "1234".indexOf(k);
  if (c < 0 && k.length === 1) c = "abcd".indexOf(k);
  if (c >= 0 && c < n && !answered(kind)) { e.preventDefault(); choose(kind, c); }
  else if (go && answered(kind) && state.runs[kind].mode === "train" && !(btn && !el.matches('[data-act="next"]'))) { e.preventDefault(); next(kind); }
  else if (k === "r" && kind === "p2") { e.preventDefault(); $("#p2-replay").hidden || $("#p2-replay").click(); }
}
function onVisibility() {                          // the app in the background: the clock stops, the question starts again on return
  const kind = partOf(current);
  if (document.hidden) { if (kind) suspend(kind); speech.stop(); return; }
  if (kind && state.runs[kind] && live[kind].on && !$(`#${kind}-run`).hidden) show(kind);
  if (swReg && Date.now() - swChecked > 30 * 60e3) { swChecked = Date.now(); swReg.update().catch(() => {}); }
  if (current === "mots" && !vstudy.turned) vShow();
  renderCounts();
}

async function init() {
  applyLook(state.settings);
  bind();
  speech.load();
  if (speech.ok) {
    try { speechSynthesis.addEventListener("voiceschanged", () => speech.load()); } catch (e) {}
    for (const t of [300, 1200, 3000]) setTimeout(() => speech.load(t === 3000), t);   // Safari does not always say when its voices are ready
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  current = null;
  try { await loadBank(); }
  catch (e) {
    $("#loading").innerHTML = `Impossible de charger la banque de questions. Vérifie la connexion, puis <button type="button" class="btn small" id="retry">Réessayer</button>`;
    $("#retry").addEventListener("click", () => location.reload());
    return;
  }
  $("#loading").hidden = true;
  for (const k in KINDS) if (state.runs[k]) live[k] = {};   // a series saved before: offered on its tab
  showView(state.settings.view);
  if (missingFiles.length) toast(`Fichiers non lus${NB}: ${missingFiles.join(", ")}.`, 4000);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(reg => {
      swReg = reg;
      const watch = w => { if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) $("#updatebar").hidden = false; }); };
      reg.addEventListener("updatefound", () => watch(reg.installing));
    }).catch(() => {});
  }
}
init();
</script>
